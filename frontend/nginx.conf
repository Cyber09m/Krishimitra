server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router client-side routing — any unmatched path falls back to
    # index.html so /dashboard, /disease etc. work on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reasonable caching for hashed build assets.
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
